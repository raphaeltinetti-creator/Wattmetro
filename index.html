<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wattmetro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabeca">
        <h1 class="titulo">Wattmetro</h1>
    </header>

    <main class="principal">
        <section class="cartao">

            <div class="campos">

               <div class="campos">
    <div class="grupo">
        <label for="num1">Leitura anterior do medidor (kWh):</label>
        <input type="number" id="num1">
    </div>

    <div class="grupo">
        <label for="num2">Leitura atual do medidor (kWh):</label>
        <input type="number" id="num2">
    </div>

    <div class="grupo">
        <label for="num3">Quantidade de dias:</label>
        <input type="number" id="num3">
    </div>

    <div class="grupo">
        <label for="band">Bandeira:</label>
        <select id="band">
            <option value="verde">Verde</option>
            <option value="amarela">Amarela</option>
            <option value="vermelha1">Vermelha 1</option>
            <option value="vermelha2">Vermelha 2</option>
        </select>
    </div>

    <div class="grupo">
        <label for="num4">Quero pagar no máximo R$: (opcional)</label>
        <input type="number" id="num4" min="0">
    </div>

    <input type="button" value="Calcular" id="botao" onclick="calcular()">
</div>

            <!-- Mensagem de erro (validações) -->
            <div id="erro"></div>

            <!-- Resultado do cálculo -->
            <div id="resultado"></div>

            <!-- Aviso de consumo alto -->
            <div id="aviso"></div>

            <!-- Resultado de Economia -->
             <div id="economia"></div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
